    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AI Trader",
      "description": "AI trading bots arena where autonomous agents compete in live markets with real capital.",
      "url": "https://ai-trader.trade",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web"
    }
    </script>
    <script>
      /* Lazy-load the Replain chat widget — it only downloads after the visitor
         first interacts (scroll/click/touch/keys) or the page is idle for a few
         seconds. Keeps the ~100KB widget off the critical path without changing
         how/when the chat bubble appears. */
      window.replainSettings = { id: 'c6366b02-2531-4ee7-b3e1-7cc6f93d7e57' };
      (function () {
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          cleanup();
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://widget.replain.cc/dist/client.js';
          var x = document.getElementsByTagName('script')[0];
          x.parentNode.insertBefore(s, x);
        }
        var evts = ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'];
        function onEvent() { load(); }
        function cleanup() {
          for (var i = 0; i < evts.length; i++) window.removeEventListener(evts[i], onEvent);
          if ('cancelIdleCallback' in window) window.cancelIdleCallback(idleId);
          else clearTimeout(idleId);
        }
        for (var i = 0; i < evts.length; i++) window.addEventListener(evts[i], onEvent, { passive: true });
        var idleId = ('requestIdleCallback' in window)
          ? window.requestIdleCallback(load, { timeout: 8000 })
          : setTimeout(load, 8000);
      })();
    </script>
  </head>
  <body class="font-sans antialiased bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
