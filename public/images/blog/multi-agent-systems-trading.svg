<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#10152a"/>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" x="8" y="8" fill="#0d1120" rx="0.5"/>
  </pattern>
  <rect width="960" height="540" fill="url(#dots)"/>

  <!-- Left scatter -->
  <g fill="#f5f6fa" opacity="0.08">
    <rect x="50" y="90" width="8" height="8"/><rect x="180" y="40" width="10" height="10"/>
    <rect x="100" y="340" width="6" height="6"/><rect x="260" y="410" width="9" height="9"/>
    <rect x="70" y="200" width="5" height="5"/><rect x="330" y="250" width="7" height="7"/>
    <rect x="170" y="480" width="8" height="8"/><rect x="380" y="150" width="6" height="6"/>
    <rect x="230" y="310" width="4" height="4"/><rect x="140" y="450" width="7" height="7"/>
  </g>
  <g fill="#f5f6fa" opacity="0.15">
    <rect x="120" y="140" width="6" height="6"/><rect x="300" y="370" width="5" height="5"/>
    <rect x="210" y="230" width="7" height="7"/><rect x="360" y="330" width="4" height="4"/>
  </g>

  <!-- Network nodes - connected circles -->
  <g fill="none" stroke="#f5f6fa" opacity="0.2" stroke-width="1.5">
    <line x1="340" y1="200" x2="400" y2="270"/>
    <line x1="340" y1="200" x2="280" y2="270"/>
    <line x1="400" y1="270" x2="340" y2="340"/>
    <line x1="280" y1="270" x2="340" y2="340"/>
    <line x1="400" y1="270" x2="280" y2="270"/>
    <line x1="340" y1="200" x2="340" y2="340"/>
  </g>

  <g fill="#f5f6fa" opacity="0.2">
    <circle cx="340" cy="200" r="12"/>
    <circle cx="280" cy="270" r="10"/>
    <circle cx="400" cy="270" r="10"/>
    <circle cx="340" cy="340" r="8"/>
  </g>

  <!-- Orange center node -->
  <circle cx="340" cy="200" r="6" fill="#7b5cff" opacity="0.6"/>

  <!-- Right side orange grid -->
  <g fill="#7b5cff" opacity="0.85">
    <rect x="700" y="90" width="10" height="10"/><rect x="718" y="90" width="10" height="10"/>
    <rect x="700" y="108" width="10" height="10"/><rect x="718" y="108" width="10" height="10"/>
    <rect x="700" y="126" width="10" height="10"/><rect x="718" y="144" width="10" height="10"/>
    <rect x="700" y="162" width="10" height="10"/><rect x="718" y="162" width="10" height="10"/>
    <rect x="700" y="180" width="10" height="10"/><rect x="718" y="180" width="10" height="10"/>
    <rect x="700" y="198" width="10" height="10"/><rect x="718" y="198" width="10" height="10"/>
    <rect x="700" y="216" width="10" height="10"/><rect x="718" y="216" width="10" height="10"/>
    <rect x="700" y="234" width="10" height="10"/><rect x="718" y="234" width="10" height="10"/>
    <rect x="700" y="252" width="10" height="10"/><rect x="718" y="252" width="10" height="10"/>
    <rect x="700" y="270" width="10" height="10"/><rect x="718" y="270" width="10" height="10"/>
  </g>

  <g fill="#7b5cff" opacity="0.5">
    <rect x="560" y="380" width="6" height="6"/><rect x="630" y="420" width="4" height="4"/>
    <rect x="510" y="350" width="5" height="5"/>
  </g>

  <text x="480" y="260" font-family="'Courier New',monospace" font-size="24" font-weight="900" fill="#f5f6fa" text-anchor="middle" letter-spacing="2">
    MULTI-AGENT SYSTEMS
  </text>
  <text x="480" y="294" font-family="'Courier New',monospace" font-size="20" font-weight="700" fill="#7b5cff" text-anchor="middle" letter-spacing="2">
    IN TRADING
  </text>
  <rect x="360" y="320" width="240" height="2" fill="#7b5cff" opacity="0.5"/>
</svg>
