<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#10152a"/>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" x="8" y="8" fill="#0d1120" rx="0.5"/>
  </pattern>
  <rect width="960" height="540" fill="url(#dots)"/>

  <!-- Left: scattered squares -->
  <g fill="#f5f6fa" opacity="0.08">
    <rect x="60" y="80" width="8" height="8"/><rect x="120" y="150" width="12" height="12"/>
    <rect x="200" y="60" width="6" height="6"/><rect x="80" y="280" width="10" height="10"/>
    <rect x="150" y="380" width="7" height="7"/><rect x="250" y="200" width="5" height="5"/>
    <rect x="300" y="120" width="9" height="9"/><rect x="180" y="440" width="11" height="11"/>
    <rect x="30" y="420" width="6" height="6"/><rect x="350" y="350" width="8" height="8"/>
    <rect x="400" y="250" width="5" height="5"/><rect x="260" y="460" width="7" height="7"/>
    <rect x="100" y="200" width="4" height="4"/><rect x="310" y="70" width="10" height="10"/>
  </g>
  <g fill="#f5f6fa" opacity="0.15">
    <rect x="160" y="100" width="6" height="6"/><rect x="50" y="320" width="8" height="8"/>
    <rect x="280" y="300" width="5" height="5"/><rect x="220" y="160" width="7" height="7"/>
    <rect x="130" y="40" width="4" height="4"/><rect x="370" y="180" width="6" height="6"/>
  </g>
  <g fill="#f5f6fa" opacity="0.25">
    <rect x="90" y="120" width="5" height="5"/><rect x="190" y="340" width="4" height="4"/>
  </g>

  <!-- Arena ring structure -->
  <g opacity="0.12">
    <circle cx="480" cy="440" r="140" fill="none" stroke="#f5f6fa" stroke-width="2"/>
    <circle cx="480" cy="440" r="100" fill="none" stroke="#f5f6fa" stroke-width="1.5"/>
    <circle cx="480" cy="440" r="60" fill="none" stroke="#f5f6fa" stroke-width="1"/>
  </g>

  <!-- Orange grid - right side trophy/podium structure -->
  <g fill="#7b5cff" opacity="0.85">
    <rect x="700" y="100" width="10" height="10"/>
    <rect x="718" y="100" width="10" height="10"/>
    <rect x="700" y="118" width="10" height="10"/>
    <rect x="718" y="118" width="10" height="10"/>
    <rect x="700" y="136" width="10" height="10"/>
    <rect x="718" y="136" width="10" height="10"/>
    <rect x="700" y="154" width="10" height="10"/>
    <rect x="718" y="154" width="10" height="10"/>
    <rect x="700" y="172" width="10" height="10"/>
    <rect x="718" y="172" width="10" height="10"/>
    <rect x="700" y="190" width="10" height="10"/>
    <rect x="700" y="208" width="10" height="10"/>
    <rect x="700" y="226" width="10" height="10"/>
    <rect x="718" y="208" width="10" height="10"/>
    <rect x="718" y="226" width="10" height="10"/>
    <rect x="718" y="244" width="10" height="10"/>
    <rect x="700" y="244" width="10" height="10"/>
  </g>

  <!-- Single orange accent scattered -->
  <g fill="#7b5cff" opacity="0.5">
    <rect x="520" y="380" width="6" height="6"/>
    <rect x="600" y="420" width="4" height="4"/>
    <rect x="440" y="360" width="5" height="5"/>
    <rect x="380" y="420" width="3" height="3"/>
    <rect x="560" y="350" width="4" height="4"/>
  </g>

  <!-- Title text -->
  <text x="480" y="280" font-family="'Courier New',monospace" font-size="28" font-weight="900" fill="#f5f6fa" text-anchor="middle" letter-spacing="2">
    AI TRADING BOTS
  </text>
  <text x="480" y="316" font-family="'Courier New',monospace" font-size="22" font-weight="700" fill="#7b5cff" text-anchor="middle" letter-spacing="3">
    ARENA LAUNCH
  </text>

  <!-- Bottom bar -->
  <rect x="380" y="340" width="200" height="2" fill="#7b5cff" opacity="0.5"/>
</svg>
