<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#F5F0EB"/>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" x="8" y="8" fill="#ECE5DD" rx="0.5"/>
  </pattern>
  <rect width="960" height="540" fill="url(#dots)"/>

  <!-- Left scatter -->
  <g fill="#1a1a1a" opacity="0.08">
    <rect x="40" y="100" width="8" height="8"/><rect x="190" y="60" width="10" height="10"/>
    <rect x="110" y="330" width="6" height="6"/><rect x="270" y="420" width="9" height="9"/>
    <rect x="80" y="200" width="5" height="5"/><rect x="340" y="260" width="7" height="7"/>
    <rect x="180" y="490" width="8" height="8"/><rect x="390" y="160" width="6" height="6"/>
    <rect x="240" y="320" width="4" height="4"/><rect x="150" y="460" width="7" height="7"/>
  </g>
  <g fill="#1a1a1a" opacity="0.15">
    <rect x="130" y="150" width="6" height="6"/><rect x="310" y="380" width="5" height="5"/>
    <rect x="220" y="250" width="7" height="7"/><rect x="370" y="340" width="4" height="4"/>
  </g>

  <!-- Step/progress indicators - numbered squares -->
  <g fill="none" stroke="#1a1a1a" opacity="0.15" stroke-width="2">
    <rect x="200" y="170" width="60" height="60" rx="4"/>
    <rect x="280" y="170" width="60" height="60" rx="4"/>
    <rect x="360" y="170" width="60" height="60" rx="4"/>
  </g>

  <!-- Connecting lines -->
  <line x1="260" y1="200" x2="280" y2="200" stroke="#1a1a1a" opacity="0.1" stroke-width="1.5"/>
  <line x1="340" y1="200" x2="360" y2="200" stroke="#1a1a1a" opacity="0.1" stroke-width="1.5"/>

  <!-- Step numbers -->
  <text x="230" y="207" font-family="'Courier New',monospace" font-size="24" font-weight="700" fill="#1a1a1a" opacity="0.2" text-anchor="middle">1</text>
  <text x="310" y="207" font-family="'Courier New',monospace" font-size="24" font-weight="700" fill="#1a1a1a" opacity="0.2" text-anchor="middle">2</text>
  <text x="390" y="207" font-family="'Courier New',monospace" font-size="24" font-weight="700" fill="#1a1a1a" opacity="0.2" text-anchor="middle">3</text>

  <!-- Orange highlight on first step -->
  <rect x="200" y="170" width="60" height="60" rx="4" fill="none" stroke="#f97316" stroke-width="2" opacity="0.6"/>

  <!-- Right side orange grid -->
  <g fill="#f97316" opacity="0.85">
    <rect x="700" y="100" width="10" height="10"/><rect x="718" y="100" width="10" height="10"/>
    <rect x="700" y="118" width="10" height="10"/><rect x="718" y="118" width="10" height="10"/>
    <rect x="700" y="136" width="10" height="10"/><rect x="718" y="154" width="10" height="10"/>
    <rect x="700" y="172" width="10" height="10"/><rect x="718" y="172" width="10" height="10"/>
    <rect x="700" y="190" width="10" height="10"/><rect x="718" y="190" width="10" height="10"/>
    <rect x="700" y="208" width="10" height="10"/><rect x="718" y="208" width="10" height="10"/>
    <rect x="700" y="226" width="10" height="10"/><rect x="718" y="226" width="10" height="10"/>
    <rect x="700" y="244" width="10" height="10"/><rect x="718" y="244" width="10" height="10"/>
    <rect x="700" y="262" width="10" height="10"/><rect x="718" y="262" width="10" height="10"/>
    <rect x="700" y="280" width="10" height="10"/><rect x="718" y="280" width="10" height="10"/>
  </g>

  <g fill="#f97316" opacity="0.5">
    <rect x="550" y="380" width="6" height="6"/><rect x="610" y="420" width="4" height="4"/>
    <rect x="500" y="350" width="5" height="5"/>
  </g>

  <text x="480" y="260" font-family="'Courier New',monospace" font-size="26" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="2">
    GETTING STARTED
  </text>
  <text x="480" y="294" font-family="'Courier New',monospace" font-size="20" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="2">
    WITH TRADER.AI
  </text>
  <rect x="350" y="320" width="260" height="2" fill="#f97316" opacity="0.5"/>
</svg>
