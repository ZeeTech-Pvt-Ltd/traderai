<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#F5F0EB"/>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" x="8" y="8" fill="#ECE5DD" rx="0.5"/>
  </pattern>
  <rect width="960" height="540" fill="url(#dots)"/>

  <!-- Left scatter -->
  <g fill="#1a1a1a" opacity="0.08">
    <rect x="40" y="90" width="10" height="10"/><rect x="150" y="50" width="6" height="6"/>
    <rect x="100" y="350" width="8" height="8"/><rect x="280" y="120" width="5" height="5"/>
    <rect x="200" y="420" width="9" height="9"/><rect x="60" y="250" width="7" height="7"/>
    <rect x="320" y="300" width="6" height="6"/><rect x="180" y="180" width="4" height="4"/>
    <rect x="380" y="220" width="8" height="8"/><rect x="130" y="470" width="5" height="5"/>
    <rect x="250" y="280" width="10" height="10"/><rect x="350" y="140" width="4" height="4"/>
  </g>
  <g fill="#1a1a1a" opacity="0.15">
    <rect x="90" y="160" width="6" height="6"/><rect x="230" y="440" width="5" height="5"/>
    <rect x="310" y="380" width="7" height="7"/><rect x="160" y="300" width="4" height="4"/>
  </g>

  <!-- Glass/transparency concept - overlapping squares -->
  <g fill="none" stroke="#1a1a1a" opacity="0.15" stroke-width="1.5">
    <rect x="250" y="180" width="160" height="160" rx="4"/>
    <rect x="290" y="140" width="160" height="160" rx="4"/>
    <rect x="270" y="220" width="160" height="160" rx="4"/>
  </g>

  <!-- Eye/visibility icon -->
  <g fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.7">
    <path d="M450,270 Q480,240 510,270 Q480,300 450,270Z"/>
    <circle cx="480" cy="270" r="8" fill="#f97316" opacity="0.3"/>
  </g>

  <!-- Right side orange grid -->
  <g fill="#f97316" opacity="0.85">
    <rect x="700" y="80" width="10" height="10"/><rect x="718" y="80" width="10" height="10"/>
    <rect x="700" y="98" width="10" height="10"/><rect x="718" y="98" width="10" height="10"/>
    <rect x="700" y="116" width="10" height="10"/><rect x="718" y="116" width="10" height="10"/>
    <rect x="700" y="134" width="10" height="10"/><rect x="718" y="134" width="10" height="10"/>
    <rect x="700" y="152" width="10" height="10"/><rect x="718" y="152" width="10" height="10"/>
    <rect x="700" y="170" width="10" height="10"/><rect x="718" y="170" width="10" height="10"/>
    <rect x="700" y="188" width="10" height="10"/><rect x="718" y="188" width="10" height="10"/>
    <rect x="700" y="206" width="10" height="10"/><rect x="718" y="206" width="10" height="10"/>
    <rect x="700" y="224" width="10" height="10"/><rect x="718" y="224" width="10" height="10"/>
    <rect x="700" y="242" width="10" height="10"/><rect x="718" y="242" width="10" height="10"/>
    <rect x="700" y="260" width="10" height="10"/><rect x="718" y="260" width="10" height="10"/>
    <rect x="700" y="278" width="10" height="10"/><rect x="718" y="278" width="10" height="10"/>
    <rect x="700" y="296" width="10" height="10"/><rect x="718" y="296" width="10" height="10"/>
    <rect x="700" y="314" width="10" height="10"/><rect x="718" y="314" width="10" height="10"/>
  </g>

  <g fill="#f97316" opacity="0.5">
    <rect x="600" y="380" width="6" height="6"/>
    <rect x="520" y="420" width="4" height="4"/>
    <rect x="560" y="340" width="5" height="5"/>
  </g>

  <text x="480" y="270" font-family="'Courier New',monospace" font-size="26" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="2">
    WHY TRANSPARENCY
  </text>
  <text x="480" y="304" font-family="'Courier New',monospace" font-size="20" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="2">
    MATTERS IN AI TRADING
  </text>
  <rect x="310" y="330" width="340" height="2" fill="#f97316" opacity="0.5"/>
</svg>
