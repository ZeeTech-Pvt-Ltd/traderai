<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#F5F0EB"/>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" x="8" y="8" fill="#ECE5DD" rx="0.5"/>
  </pattern>
  <rect width="960" height="540" fill="url(#dots)"/>

  <!-- Left scatter -->
  <g fill="#1a1a1a" opacity="0.08">
    <rect x="40" y="80" width="8" height="8"/><rect x="170" y="50" width="10" height="10"/>
    <rect x="100" y="320" width="6" height="6"/><rect x="250" y="400" width="9" height="9"/>
    <rect x="60" y="190" width="5" height="5"/><rect x="320" y="240" width="7" height="7"/>
    <rect x="160" y="470" width="8" height="8"/><rect x="370" y="140" width="6" height="6"/>
    <rect x="220" y="300" width="4" height="4"/><rect x="130" y="440" width="7" height="7"/>
  </g>
  <g fill="#1a1a1a" opacity="0.15">
    <rect x="110" y="120" width="6" height="6"/><rect x="290" y="360" width="5" height="5"/>
    <rect x="200" y="220" width="7" height="7"/><rect x="350" y="320" width="4" height="4"/>
  </g>

  <!-- Copy/duplicate icon - two overlapping squares -->
  <g fill="none" stroke="#1a1a1a" opacity="0.15" stroke-width="2">
    <rect x="220" y="170" width="110" height="110" rx="4"/>
    <rect x="260" y="210" width="110" height="110" rx="4"/>
  </g>
  <!-- Arrow between them -->
  <polyline points="330,245 370,245 370,270" fill="none" stroke="#f97316" stroke-width="2" opacity="0.6"/>
  <polyline points="360,260 370,270 380,260" fill="none" stroke="#f97316" stroke-width="2" opacity="0.6"/>

  <!-- Right side orange grid -->
  <g fill="#f97316" opacity="0.85">
    <rect x="700" y="90" width="10" height="10"/><rect x="718" y="90" width="10" height="10"/>
    <rect x="700" y="108" width="10" height="10"/><rect x="718" y="108" width="10" height="10"/>
    <rect x="700" y="126" width="10" height="10"/><rect x="718" y="144" width="10" height="10"/>
    <rect x="700" y="162" width="10" height="10"/><rect x="718" y="162" width="10" height="10"/>
    <rect x="700" y="180" width="10" height="10"/><rect x="718" y="180" width="10" height="10"/>
    <rect x="700" y="198" width="10" height="10"/><rect x="718" y="198" width="10" height="10"/>
    <rect x="700" y="216" width="10" height="10"/><rect x="718" y="216" width="10" height="10"/>
    <rect x="700" y="234" width="10" height="10"/><rect x="718" y="234" width="10" height="10"/>
    <rect x="700" y="252" width="10" height="10"/><rect x="718" y="252" width="10" height="10"/>
    <rect x="700" y="270" width="10" height="10"/><rect x="718" y="270" width="10" height="10"/>
  </g>

  <g fill="#f97316" opacity="0.5">
    <rect x="560" y="380" width="6" height="6"/><rect x="620" y="420" width="4" height="4"/>
    <rect x="520" y="340" width="5" height="5"/>
  </g>

  <text x="480" y="260" font-family="'Courier New',monospace" font-size="24" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="2">
    COPY TRADING
  </text>
  <text x="480" y="294" font-family="'Courier New',monospace" font-size="20" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="2">
    DEVELOPMENT UPDATE
  </text>
  <rect x="340" y="320" width="280" height="2" fill="#f97316" opacity="0.5"/>
</svg>
